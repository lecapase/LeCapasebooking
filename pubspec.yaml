name: lecapase_booking
description: "Le Capase Booking"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

  # Firebase
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7

  # Face ID / impronta digitale / biometria
  local_auth: ^3.0.2

  google_fonts: ^8.2.1
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0

  # Apertura WhatsApp / Email / link esterni
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true

  # Icona delle app native: resta invariata
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

  # Icona della pagina Web aggiunta alla Home
  web:
    generate: true
    image_path: "assets/images/logo.png"