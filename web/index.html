<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Le Capase Booking Gestionale">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Le Capase Booking">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Le Capase Booking</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>

<script>
  (async function startLeCapaseBooking() {
    try {
      if ('serviceWorker' in navigator) {
        const registrations =
          await navigator.serviceWorker.getRegistrations();

        for (const registration of registrations) {
          const worker =
            registration.active ||
            registration.waiting ||
            registration.installing;

          const scriptUrl =
            worker ? worker.scriptURL : '';

          if (scriptUrl.includes('flutter_service_worker.js')) {
            await registration.unregister();
          }
        }
      }

      if ('caches' in window) {
        const cacheKeys = await caches.keys();

        for (const key of cacheKeys) {
          if (
            key.startsWith('flutter-') ||
            key === 'flutter-app-cache' ||
            key === 'flutter-temp-cache'
          ) {
            await caches.delete(key);
          }
        }
      }

      if ('serviceWorker' in navigator) {
        await navigator.serviceWorker.register(
          'firebase-messaging-sw.js',
          {
            scope: '/firebase-cloud-messaging-push-scope',
          }
        );
      }
    } catch (error) {
      console.warn(
        'Aggiornamento automatico non completato:',
        error
      );
    } finally {
      const flutterBootstrap =
        document.createElement('script');

      flutterBootstrap.src =
        'flutter_bootstrap.js';

      flutterBootstrap.async =
        true;

      document.body.appendChild(
        flutterBootstrap
      );
    }
  })();
</script>

</body>
</html>
