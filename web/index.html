<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Le Capase Booking Gestionale">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Le Capase Booking">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Le Capase Booking</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async function () {
      try {
        const registrations =
          await navigator.serviceWorker.getRegistrations();

        for (const registration of registrations) {
          const worker =
            registration.active ||
            registration.waiting ||
            registration.installing;

          const scriptUrl =
            worker ? worker.scriptURL : '';

          if (scriptUrl.includes('flutter_service_worker.js')) {
            await registration.unregister();
          }
        }

        if ('caches' in window) {
          const cacheKeys = await caches.keys();

          for (const key of cacheKeys) {
            if (key.startsWith('flutter-')) {
              await caches.delete(key);
            }
          }
        }

        await navigator.serviceWorker.register(
          'firebase-messaging-sw.js',
          {
            scope: '/firebase-cloud-messaging-push-scope',
          }
        );
      } catch (error) {
        console.warn(
          'Service worker cleanup/registration failed:',
          error
        );
      }
    });
  }
</script>

<script src="flutter_bootstrap.js" async></script>

</body>
</html>
